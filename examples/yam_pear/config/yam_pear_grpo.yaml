# Skill-ladder GRPO of Qwen3.8-27B-PEAR on simulated YAM stations: LoRA, score centering, vLLM rollouts.
# Launched by examples/yam_pear/run_qwen3_8_27b_pear_fsdp.sh; see examples/yam_pear/README.md.
# NOT yet run end to end with the real model (see the README's "What is verified").
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  # train_files is only read without the curriculum dataloader (custom_dataloader: null)
  train_files: ~/data/yam_pear/train.parquet
  val_files: ~/data/yam_pear/val.parquet
  # prompt groups per step = the groups the streams below add up to (5 + 5 + 6)
  train_batch_size: 16
  val_batch_size: 64
  # the drivers' chat(): thinking on, low effort, earlier turns' reasoning not kept (short-context protocol)
  apply_chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: false
    reasoning_effort: low
  custom_dataloader:
    _target_: verl.experimental.yam_pear.dataloader.CurriculumDataLoader
    streams: "raiden:pick_cube:5,raiden:pick_banana:5,abc:put_relative:6"
    # shared by the dataloader (trainer) and the agent loop workers: must be on a filesystem all of them see
    outcome_dir: ${trainer.default_local_dir}/curriculum
    lo: 0.2
    hi: 0.8
    holdout_rungs: ""      # e.g. "7": never trained on, still evaluated if in the val file
    seed0: 1000
    calibrate: true        # needs trainer.val_before_train
    cal_rungs: "0,1,2,3,5,7,11"
    cal_seeds: 8
    cal_seed0: 500

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  # REINFORCE on the sampler's log-probs with truncated token importance weights and score centering
  rollout_correction:
    bypass_mode: true
    loss_type: reinforce
    rollout_is: token
    rollout_is_threshold: 2.0
    score_centering: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ~/models/Qwen3.8-27B-PEAR
    use_remove_padding: true
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    # the language model's MLP layers only, as the trainer this recipe replaces (a PEFT regex)
    target_modules: '.*language_model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)'
  actor:
    strategy: fsdp
    # ONE optimizer update per training step. A step's samples are (groups x rollout.n x turns) rows, and verl
    # takes one optimizer step per mini-batch of (ppo_mini_batch_size x rollout.n) rows, accumulating the
    # gradient over the micro-batches inside it. So the mini-batch is sized to the most rows a step can have:
    # 16 groups x 25 (the longest turn cap in RUNGS) = 400. The batch is padded up to that with masked rows
    # that add nothing to the loss or its token count (README, "One update per step"). Keep this at
    # data.train_batch_size x the longest turn cap; tests/experimental/yam_pear checks it.
    ppo_mini_batch_size: 400
    ppo_epochs: 1
    # needed for a mini-batch larger than train_batch_size (the fixed-size path rejects it); micro-batches
    # are then packed by tokens. The budget must cover the longest sample (prompt_length + response_length).
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 24576
    ppo_micro_batch_size_per_gpu: 1   # unused with use_dynamic_bsz
    use_kl_loss: false
    entropy_coeff: 0
    loss_agg_mode: token-mean
    optim:
      lr: 1.0e-4
      weight_decay: 0.0
      betas: [0.9, 0.99]
      clip_grad: 1.0
    policy_loss:
      # score centering must be mirrored here (verl.utils.config._validate_score_centering_config)
      rollout_correction:
        bypass_mode: true
        loss_type: reinforce
        rollout_is: token
        rollout_is_threshold: 2.0
        score_centering: true
    fsdp_config:
      # single GPU shared with vLLM: keep the trainer's weights off the GPU while rollouts run
      param_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    mode: async
    n: 8                   # the group of same-seed rollouts
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    # log_prob_use_dynamic_bsz / log_prob_max_token_len_per_gpu follow the actor settings by default
    topk_log_probs: 32     # the sampler's top-32 head for score centering
    # per TURN, not per episode: every turn is its own sample (system + 4 turns of text + 3 frames)
    prompt_length: 16384
    response_length: 6144
    max_model_len: 32768
    max_num_seqs: 32
    max_num_batched_tokens: 8192
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    load_format: safetensors   # required for LoRA: vLLM loads the base model itself
    limit_images: 3
    enable_prefix_caching: true
    free_cache_engine: true
    val_kwargs:
      # evaluation samples exactly like training (the orchestrator's --eval-driver-args "--top-p 1.0")
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      do_sample: true
      n: 1
    agent:
      num_workers: 8
      default_agent_loop: yam_pear_agent
      # agent_loop_fake.yaml in the same directory runs the fake simulator instead
      agent_loop_config_path: verl/experimental/yam_pear/config/agent_loop.yaml

trainer:
  v1:
    trainer_mode: sync     # on-policy: the curriculum needs a step's episodes finished before it plans the next
  nnodes: 1
  n_gpus_per_node: 1
  total_training_steps: 200
  val_before_train: true
  test_freq: 10
  save_freq: 10
  project_name: yam_pear
  experiment_name: qwen3_8_27b_pear_ladder_grpo
  logger: ["console"]
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
